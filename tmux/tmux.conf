# BaseNvim tmux configuration
# Prefix: Ctrl+s

unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Keep the minimal appearance from astro_cpp_starter.
set -g status off
set -g mouse on
set -g history-limit 100000
set -s escape-time 10
set -g focus-events on
set -g detach-on-destroy off
set -g renumber-windows on
setw -g mode-keys vi

# Let Snacks.image pass the Kitty graphics protocol through tmux 3.3+.
set -g allow-passthrough on

# True color in Neovim and other terminal applications.
set -g default-terminal "tmux-256color"
# Reset this option on every reload so capabilities inherited from a tmux server
# that was started under another emulator cannot linger. macOS 15 Terminal.app
# reports xterm-256color but cannot render 24-bit RGB; Linux's default GNOME
# Terminal can. Tahoe and later advertise RGB without this compatibility entry.
set -gu terminal-features
if-shell '[ "$(uname -s)" = "Linux" ]' \
  'set -as terminal-features ",xterm-256color:RGB"'

# Reload this file with Ctrl+s, r.
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Keep tmux's default split keys:
#   Ctrl+s, %  creates a left/right split
#   Ctrl+s, "  creates a top/bottom split
# Override only the working directory so new panes open beside the current pane.
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind C kill-window
# With the status bar hidden, show the current location only when requested.
bind i display-message 'session: #S  window: #I:#W  pane: #P'

# smart-splits.nvim marks its tmux pane with @pane-is-vim. That explicit marker
# is more reliable than inspecting the pane process tree and stays correct when
# Neovim exits or suspends.

# Press Ctrl+s once, then hold or repeatedly press h/j/k/l. In Neovim, relay
# the same Ctrl+s + direction sequence to smart-splits; elsewhere resize tmux.
bind -r h if -F '#{@pane-is-vim}' { send-keys C-s h } { resize-pane -L 5 }
bind -r j if -F '#{@pane-is-vim}' { send-keys C-s j } { resize-pane -D 5 }
bind -r k if -F '#{@pane-is-vim}' { send-keys C-s k } { resize-pane -U 5 }
bind -r l if -F '#{@pane-is-vim}' { send-keys C-s l } { resize-pane -R 5 }

# Smart Ctrl+h/j/k/l navigation across Neovim windows and tmux panes.
bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{pane_at_right}'  {} { select-pane -R } }

bind-key -T copy-mode-vi C-h if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi C-j if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi C-k if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind-key -T copy-mode-vi C-l if-shell -F '#{pane_at_right}'  {} { select-pane -R }

# Vi copy mode. Prefer the native clipboard for macOS, Wayland, then X11;
# VTE-based Linux terminals do not consistently support OSC 52.
set -s set-clipboard off
if-shell 'command -v pbcopy >/dev/null 2>&1' {
  set -s copy-command 'pbcopy'
} {
  if-shell 'command -v wl-copy >/dev/null 2>&1 && [ -n "$WAYLAND_DISPLAY" ]' {
    set -s copy-command 'wl-copy'
  } {
    set -s copy-command 'xclip -selection clipboard >/dev/null'
  }
}
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Persist tmux's sessions, windows, pane layouts, working directories, and
# conservative program list. Neovim remains responsible for its own buffers.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# TPM must remain the last command in this file.
run '~/.tmux/plugins/tpm/tpm'
